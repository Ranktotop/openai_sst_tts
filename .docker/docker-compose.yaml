version: "3.8"

services:
  # =============================================================================
  # GPU Stack
  # =============================================================================
 
  #  STT ========================================================================
  speaches_server_gpu:
    ports:
      - "${SPEACHES_PORT:-8000}:8000"
      # see here: https://github.com/speaches-ai/speaches/blob/master/compose.cuda.yaml
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    profiles: ["stt_gpu", "all_gpu"]
    volumes:
      - model_data:/home/ubuntu/.cache/huggingface/hub
    environment:
      API_KEY: ${SPEACHES_API_KEY}
      LOG_LEVEL: ${GLOBAL_LOG_LEVEL:-INFO}
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__COMPUTE_TYPE: float16
      # WHISPER__LANGUAGE: de
      ENABLE_UI: false
      WHISPER__MODEL: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, compat32, graphics, utility, video]
    labels:
      - autoheal.speaches=true
      - autoheal.gpucontainer=true
    networks:
      default:
        aliases:
          - speaches_server_gpu
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "Authorization: Bearer ${SPEACHES_API_KEY}",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  #  TTS ========================================================================
  qwen3_server_gpu:
    ports:
      - "${QWEN3_PORT:-8880}:8880"
    image: ranktotop/qwen3-tts:gpu-latest
    profiles: ["tts_gpu", "all_gpu"]
    volumes:
      - model_data:/home/appuser/.cache/huggingface
      #- voice_library:./voice_library
    environment:
      HOST: 0.0.0.0
      PORT: 8880
      WORKERS: 1
      CORS_ORIGINS: "*"
      TTS_BACKEND: official
      TTS_WARMUP_ON_START: false
      # When using device_ids filter, the GPU appears as device 0 inside container
      CUDA_VISIBLE_DEVICES: 0
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TTS_MODEL_NAME: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      ENABLE_VOICE_STUDIO: ${ENABLE_VOICE_STUDIO:-false}
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [compute, compat32, graphics, utility, video]
    labels:
      - autoheal.qwen3=true
      - autoheal.gpucontainer=true
    networks:
      default:
        aliases:
          - qwen3_server_gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 120s
      timeout: 60s
      retries: 10
      start_period: 600s


  # =============================================================================
  # CPU Stack
  # =============================================================================
 
  #  STT ========================================================================
  speaches_server_cpu:
    ports:
      - "${SPEACHES_PORT:-8000}:8000"
      # see here: https://github.com/speaches-ai/speaches/blob/master/compose.cuda.yaml
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    profiles: ["stt_cpu", "all_cpu"]
    volumes:
      - model_data:/home/ubuntu/.cache/huggingface/hub
    environment:
      API_KEY: ${SPEACHES_API_KEY}
      LOG_LEVEL: ${GLOBAL_LOG_LEVEL:-INFO}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: float32
      # WHISPER__LANGUAGE: de
      ENABLE_UI: false
      WHISPER__MODEL: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    restart: unless-stopped
    networks:
      default:
        aliases:
          - speaches_server_cpu
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "Authorization: Bearer ${SPEACHES_API_KEY}",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  #  TTS ========================================================================
  qwen3_server_cpu:
    ports:
      - "${QWEN3_PORT:-8880}:8880"
    image: ranktotop/qwen3-tts:cpu-latest
    profiles: ["tts_cpu", "all_cpu"]
    volumes:
      - model_data:/home/appuser/.cache/huggingface
      #- voice_library:./voice_library
    environment:
      HOST: 0.0.0.0
      PORT: 8880
      WORKERS: 1
      CORS_ORIGINS: "*"
      TTS_BACKEND: official
      TTS_WARMUP_ON_START: false
      TTS_MODEL_NAME: Qwen/Qwen3-TTS-12Hz-1.7B-Base
      ENABLE_VOICE_STUDIO: ${ENABLE_VOICE_STUDIO:-false}
    restart: unless-stopped
    networks:
      default:
        aliases:
          - qwen3_server_cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 120s
      timeout: 60s
      retries: 10
      start_period: 600s

volumes:
  model_data:

networks:
  default: