version: "3.8"

services:
  # =============================================================================
  # Audio STT + TTS
  # =============================================================================

  speaches_server:
    # we use ports for making the service accessable by other containers
    ports:
      - "${SPEACHES_PORT:-8000}:8000"
      # see here: https://github.com/speaches-ai/speaches/blob/master/compose.cuda.yaml
    image: ghcr.io/speaches-ai/speaches:latest-cuda-12.6.3
    profiles: ["stt", "all"]
    volumes:
      - speaches_data:/home/ubuntu/.cache/huggingface/hub
    environment:
      API_KEY: ${SPEACHES_API_KEY}
      LOG_LEVEL: ${GLOBAL_LOG_LEVEL:-INFO}
      WHISPER__INFERENCE_DEVICE: ${WHISPER_DEVICE:-cuda}
      WHISPER__COMPUTE_TYPE: float16
      WHISPER__LANGUAGE: de
      ENABLE_UI: false
      WHISPER__MODEL: mobiuslabsgmbh/faster-whisper-large-v3-turbo
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    labels:
      - autoheal.whisper=true
      - autoheal.gpucontainer=true
    networks:
      default:
        aliases:
          - speaches_server
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "Authorization: Bearer ${SPEACHES_API_KEY}",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  # ============================================
  # Qwen3-TTS - OpenAI-kompatible TTS API
  # ============================================
  # GPU-Version mit Official Backend (empfohlen)
  # 
  # Unterstützte Sprachen: Deutsch, Englisch, Chinesisch,
  # Japanisch, Koreanisch, Französisch, Russisch,
  # Portugiesisch, Spanisch, Italienisch
  #
  # API-Endpunkt: POST /v1/audio/speech
  # Web-Interface: http://localhost:8880
  # ============================================

  qwen3-tts:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qwen3-tts
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      # Server-Konfiguration
      - HOST=0.0.0.0
      - PORT=8880
      - WORKERS=1
      - CORS_ORIGINS=*
      
      # Backend: official (stabil) oder vllm_omni (schneller)
      - TTS_BACKEND=official
      
      # Modell: 1.7B für beste Qualität, 0.6B für weniger VRAM
      # CustomVoice = 9 Premium-Stimmen + Instruktionen
      # Base = Voice Cloning
      # VoiceDesign = Stimme per Beschreibung erstellen
      - TTS_MODEL_NAME=Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
      
      # Warmup beim Start (erste Requests schneller)
      - TTS_WARMUP_ON_START=true
      
      # Voice Studio aktivieren (optional)
      - ENABLE_VOICE_STUDIO=false
      
    volumes:
      # Model-Cache persistent machen (wichtig!)
      - huggingface_cache:/root/.cache/huggingface
      # Optional: Eigene Stimmen
      - ./voices:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s  # Modell-Download kann dauern

volumes:
  huggingface_cache:
    name: qwen3-tts-models