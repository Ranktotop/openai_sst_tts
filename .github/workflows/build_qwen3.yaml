name: Build & Push Qwen3-TTS Docker Images

on:
  push:
    branches: [main]

env:
  IMG_VERSION: "0.0.1"

jobs:
  build-gpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Qwen3-TTS-Openai-Fastapi
        uses: actions/checkout@v4
        with:
          repository: groxaxo/Qwen3-TTS-Openai-Fastapi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if GPU image exists
        id: hub-check
        run: |
          if docker manifest inspect ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-${IMG_VERSION} > /dev/null 2>&1; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build GPU image
        if: steps.hub-check.outputs.skip_build == 'false'
        run: |
          docker build --target production -t ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-${IMG_VERSION} .

      - name: Push GPU image
        if: steps.hub-check.outputs.skip_build == 'false'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-${IMG_VERSION}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-${IMG_VERSION} ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:gpu-latest

  build-cpu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Qwen3-TTS-Openai-Fastapi
        uses: actions/checkout@v4
        with:
          repository: groxaxo/Qwen3-TTS-Openai-Fastapi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if CPU image exists
        id: hub-check
        run: |
          if docker manifest inspect ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-${IMG_VERSION} > /dev/null 2>&1; then
            echo "skip_build=true" >> $GITHUB_OUTPUT
          else
            echo "skip_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Build CPU image
        if: steps.hub-check.outputs.skip_build == 'false'
        run: |
          docker build --target cpu-base -t ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-${IMG_VERSION} .

      - name: Push CPU image
        if: steps.hub-check.outputs.skip_build == 'false'
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-${IMG_VERSION}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-${IMG_VERSION} ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/qwen3-tts:cpu-latest
